<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Case Tree Viewer</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-soft: #f1f4f8;
  --surface-strong: #e8edf4;
  --border: #d7dee8;
  --border-strong: #b9c4d2;
  --text: #17202e;
  --text-muted: #667085;
  --text-faint: #8a95a5;
  --accent: #1463d9;
  --accent-soft: #e7f0ff;
  --accent-strong: #0b4faf;
  --setup: #13795b;
  --setup-soft: #e7f5ef;
  --assert: #b54708;
  --assert-soft: #fff1e5;
  --danger: #b42318;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  height: 100%;
}

body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

button,
input {
  font: inherit;
}

.container {
  display: grid;
  grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
  height: 100vh;
  min-height: 0;
}

.left-panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
}

.navigator-header {
  flex: 0 0 auto;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
}

.eyebrow {
  margin: 0 0 4px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.navigator-title {
  margin: 0;
  color: var(--text);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.25;
}

.tree-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.pill {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1;
}

.tree-shell {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 10px 8px 18px;
}

.tree-node {
  position: relative;
  display: grid;
  grid-template-columns: 18px 22px minmax(0, 1fr);
  align-items: center;
  min-height: 30px;
  margin: 1px 0;
  padding: 4px 9px 4px var(--node-pad, 10px);
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}

.tree-node:hover {
  background: var(--surface-soft);
  border-color: var(--border);
}

.tree-node.selected {
  background: var(--accent-soft);
  border-color: #a9c7f5;
  color: var(--accent-strong);
  box-shadow: inset 3px 0 0 var(--accent);
}

.tree-node::before {
  content: "";
  position: absolute;
  left: calc(var(--node-pad, 10px) - 12px);
  top: -2px;
  bottom: -2px;
  width: 1px;
  background: var(--border);
  opacity: var(--guide-opacity, 0);
}

.toggle {
  width: 18px;
  color: var(--text-faint);
  font-size: 11px;
  line-height: 1;
  text-align: center;
}

.node-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  font-size: 12px;
  line-height: 1;
}

.tree-node.root .node-icon {
  background: var(--accent-soft);
  color: var(--accent-strong);
}

.tree-node.dir .node-icon {
  background: var(--surface-strong);
  color: #475467;
}

.tree-node.leaf .node-icon {
  background: var(--assert-soft);
  color: var(--assert);
}

.node-name {
  overflow: hidden;
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tree-node.leaf .node-name {
  font-weight: 500;
}

.tree-children.collapsed {
  display: none;
}

.right-panel {
  display: grid;
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--bg);
}

.document-panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--surface);
}

.setup-panel {
  border-bottom: 1px solid var(--border);
}

.panel-header {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  min-height: 58px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.94);
}

.panel-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.panel-title {
  margin: 0;
  color: var(--text);
  font-size: 14px;
  font-weight: 750;
  line-height: 1.25;
}

.panel-subtitle {
  overflow: hidden;
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.section-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 800;
}

.setup-panel .section-mark {
  background: var(--setup-soft);
  color: var(--setup);
}

.assert-panel .section-mark {
  background: var(--assert-soft);
  color: var(--assert);
}

.loading-chip {
  display: none;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 12px;
  white-space: nowrap;
}

.loading-chip.visible {
  display: inline-flex;
}

.spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 18px 20px 26px;
}

.content-stack {
  max-width: 980px;
}

.chain-entry {
  margin-bottom: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.chain-entry.local {
  border-color: #9fd7c4;
}

.chain-entry-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 34px;
  padding: 7px 11px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-soft);
}

.chain-entry.local .chain-entry-header {
  background: var(--setup-soft);
}

.source-name {
  overflow: hidden;
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.source-kind {
  flex: 0 0 auto;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.content-block {
  padding: 12px 14px 14px;
  font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
}

.assert-document {
  max-width: 980px;
  border: 1px solid #f2c29b;
  border-radius: 8px;
  background: #fffaf5;
  box-shadow: var(--shadow);
}

.assert-document .content-block {
  padding: 14px 16px 16px;
}

.md-h2 {
  margin: 10px 0 5px;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.35;
}

.md-h2:first-child {
  margin-top: 0;
}

.md-li {
  position: relative;
  padding-left: 18px;
}

.md-li::before {
  content: "-";
  position: absolute;
  left: 4px;
  color: var(--text-faint);
}

.md-hr {
  height: 1px;
  margin: 10px 0;
  border: none;
  background: var(--border);
}

.md-line {
  min-height: 20px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.empty-state,
.error-state {
  display: flex;
  align-items: center;
  min-height: 96px;
  max-width: 720px;
  padding: 18px;
  border: 1px dashed var(--border-strong);
  border-radius: 8px;
  background: var(--surface-soft);
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.45;
}

.error-state {
  border-color: #f3b4af;
  background: #fff4f2;
  color: var(--danger);
}

.initial-loading {
  padding: 9px 12px;
  color: var(--text-muted);
  font-size: 13px;
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #c5cfdb;
  border: 3px solid transparent;
  border-radius: 999px;
  background-clip: content-box;
}

@media (max-width: 760px) {
  body {
    overflow: auto;
  }

  .container {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(220px, 36vh) minmax(520px, 64vh);
    height: auto;
    min-height: 100vh;
  }

  .left-panel {
    border-right: none;
    border-bottom: 1px solid var(--border);
  }

  .right-panel {
    min-height: 520px;
  }

  .panel-header {
    padding: 11px 14px;
  }

  .panel-body {
    padding: 14px;
  }
}
</style>
</head>
<body>
<div class="container">
  <aside class="left-panel">
    <div class="navigator-header">
      <p class="eyebrow">Navigator</p>
      <h1 class="navigator-title">Test Case Tree</h1>
      <div class="tree-meta" id="tree-meta">
        <span class="pill">Loading tree</span>
      </div>
    </div>
    <div class="tree-shell">
      <div id="tree"><div class="initial-loading">Loading tree...</div></div>
    </div>
  </aside>

  <main class="right-panel">
    <section class="document-panel setup-panel">
      <header class="panel-header">
        <div>
          <div class="panel-title-row">
            <span class="section-mark">S</span>
            <h2 class="panel-title">Effective setup</h2>
          </div>
          <div class="panel-subtitle" id="setup-subtitle">Select a node to inspect inherited setup</div>
        </div>
        <div class="loading-chip" id="setup-loading"><span class="spinner"></span><span>Refreshing</span></div>
      </header>
      <div class="panel-body" id="setup-content">
        <div class="empty-state">Select a node from the tree.</div>
      </div>
    </section>

    <section class="document-panel assert-panel">
      <header class="panel-header">
        <div>
          <div class="panel-title-row">
            <span class="section-mark">A</span>
            <h2 class="panel-title">Assertions</h2>
          </div>
          <div class="panel-subtitle" id="assert-subtitle">Select a runnable leaf to inspect assertions</div>
        </div>
        <div class="loading-chip" id="assert-loading"><span class="spinner"></span><span>Refreshing</span></div>
      </header>
      <div class="panel-body" id="assert-content">
        <div class="empty-state">Select a leaf node to view assertions.</div>
      </div>
    </section>
  </main>
</div>

<script>
let selectedPath = null;
let selectedType = null;
let selectionRequest = 0;

async function fetchTree() {
  const res = await fetch('/api/tree');
  if (!res.ok) throw new Error('Cannot load tree');
  return res.json();
}

async function fetchChain(path) {
  const res = await fetch('/api/chain?path=' + encodeURIComponent(path));
  if (!res.ok) throw new Error('Cannot load setup');
  return res.json();
}

async function fetchAssert(path) {
  const res = await fetch('/api/assert?path=' + encodeURIComponent(path));
  if (!res.ok) throw new Error('Cannot load assertions');
  return res.json();
}

function renderTree(node, depth) {
  var hasChildren = node.children && node.children.length > 0;
  var pad = 10 + depth * 18;
  var guideOpacity = depth > 0 ? 1 : 0;
  var html = '';

  html += '<div class="tree-node ' + escapeHtml(node.type);
  if (node.path === selectedPath) html += ' selected';
  html += '" style="--node-pad:' + pad + 'px;--guide-opacity:' + guideOpacity + '"';
  html += ' data-path="' + escapeAttr(node.path) + '" data-type="' + escapeAttr(node.type) + '">';
  html += '<span class="toggle">' + (hasChildren ? 'v' : '') + '</span>';
  html += '<span class="node-icon">' + iconForType(node.type) + '</span>';
  html += '<span class="node-name" title="' + escapeAttr(displayPath(node.path, node.name)) + '">' + escapeHtml(node.name) + '</span>';
  html += '</div>';

  if (hasChildren) {
    html += '<div class="tree-children">';
    for (var i = 0; i < node.children.length; i++) {
      html += renderTree(node.children[i], depth + 1);
    }
    html += '</div>';
  }

  return html;
}

function iconForType(type) {
  if (type === 'root') return 'R';
  if (type === 'dir') return 'D';
  return 'T';
}

function displayPath(path, fallback) {
  return path || fallback || 'root';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(String(str || '')));
  return div.innerHTML;
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

function renderContent(md) {
  if (!md) return '<div class="empty-state">(empty)</div>';

  var lines = md.split('\n');
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.substring(0, 3) === '## ') {
      html += '<div class="md-h2">' + escapeHtml(line.substring(3)) + '</div>';
    } else if (line.substring(0, 2) === '- ') {
      html += '<div class="md-li">' + escapeHtml(line.substring(2)) + '</div>';
    } else if (/^\d+\.\s/.test(line)) {
      var idx = line.indexOf('. ');
      html += '<div class="md-li">' + escapeHtml(line.substring(idx + 2)) + '</div>';
    } else if (line === '---') {
      html += '<hr class="md-hr">';
    } else if (line.trim() === '') {
      html += '<div class="md-line"></div>';
    } else {
      html += '<div class="md-line">' + escapeHtml(line) + '</div>';
    }
  }
  return html;
}

function setLoading(kind, isLoading) {
  var el = document.getElementById(kind + '-loading');
  if (el) el.classList.toggle('visible', isLoading);
}

function setSelectedTreeNode(path) {
  var selected = document.querySelectorAll('.tree-node.selected');
  for (var i = 0; i < selected.length; i++) {
    selected[i].classList.remove('selected');
  }

  var nodes = document.querySelectorAll('.tree-node');
  for (var j = 0; j < nodes.length; j++) {
    if (nodes[j].dataset.path === path) {
      nodes[j].classList.add('selected');
      return;
    }
  }
}

function renderSetupChain(chain) {
  if (!chain || chain.length === 0) {
    return '<div class="empty-state">No setup files were found in this node or its ancestors.</div>';
  }

  var html = '<div class="content-stack">';
  for (var i = 0; i < chain.length; i++) {
    var entry = chain[i];
    var isLocal = i === chain.length - 1 && /\(local\)$/.test(entry.source);
    var label = isLocal ? entry.source.replace(/\s+\(local\)$/, '') : entry.source;
    html += '<article class="chain-entry' + (isLocal ? ' local' : '') + '">';
    html += '<div class="chain-entry-header">';
    html += '<span class="source-name">' + escapeHtml(label) + '</span>';
    html += '<span class="source-kind">' + (isLocal ? 'Local setup' : 'Inherited') + '</span>';
    html += '</div>';
    html += '<div class="content-block">' + renderContent(entry.content) + '</div>';
    html += '</article>';
  }
  html += '</div>';
  return html;
}

function renderAssert(assertData, nodeType) {
  if (!assertData || !assertData.content || assertData.content === 'no assert') {
    if (nodeType === 'leaf') {
      return '<div class="empty-state">This leaf has no ASSERT.md content.</div>';
    }
    return '<div class="empty-state">This is a grouping node. Assertions are expected on runnable leaf nodes.</div>';
  }
  return '<article class="assert-document"><div class="content-block">' + renderContent(assertData.content) + '</div></article>';
}

async function selectNode(path, nodeType) {
  selectedPath = path;
  selectedType = nodeType;
  selectionRequest++;
  var requestID = selectionRequest;
  var label = displayPath(path, 'root');

  setSelectedTreeNode(path);
  document.getElementById('setup-subtitle').textContent = label;
  document.getElementById('assert-subtitle').textContent = nodeType === 'leaf' ? label : label + ' · grouping node';
  setLoading('setup', true);
  setLoading('assert', true);

  try {
    var chain = await fetchChain(path);
    if (requestID === selectionRequest) {
      document.getElementById('setup-content').innerHTML = renderSetupChain(chain);
    }
  } catch (e) {
    if (requestID === selectionRequest) {
      document.getElementById('setup-content').innerHTML = '<div class="error-state">Error loading setup.</div>';
    }
  } finally {
    if (requestID === selectionRequest) setLoading('setup', false);
  }

  try {
    var assertData = await fetchAssert(path);
    if (requestID === selectionRequest) {
      document.getElementById('assert-content').innerHTML = renderAssert(assertData, nodeType);
    }
  } catch (e) {
    if (requestID === selectionRequest) {
      document.getElementById('assert-content').innerHTML = '<div class="error-state">Error loading assertions.</div>';
    }
  } finally {
    if (requestID === selectionRequest) setLoading('assert', false);
  }
}

function handleTreeClick(e) {
  var node = e.target.closest('.tree-node');
  if (!node) return;

  var path = node.dataset.path;
  var type = node.dataset.type;
  var children = node.nextElementSibling;
  if (children && children.classList.contains('tree-children')) {
    children.classList.toggle('collapsed');
    var toggleEl = node.querySelector('.toggle');
    if (toggleEl) {
      toggleEl.textContent = children.classList.contains('collapsed') ? '>' : 'v';
    }
  }

  selectNode(path, type);
}

function countNodes(node, counts) {
  counts.total++;
  counts[node.type] = (counts[node.type] || 0) + 1;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      countNodes(node.children[i], counts);
    }
  }
}

function renderTreeMeta(tree) {
  var counts = { total: 0, root: 0, dir: 0, leaf: 0 };
  countNodes(tree, counts);
  document.getElementById('tree-meta').innerHTML =
    '<span class="pill">' + counts.total + ' nodes</span>' +
    '<span class="pill">' + counts.leaf + ' leaves</span>' +
    '<span class="pill">' + counts.dir + ' groups</span>';
}

async function init() {
  try {
    var tree = await fetchTree();
    var treeEl = document.getElementById('tree');
    treeEl.innerHTML = renderTree(tree, 0);
    renderTreeMeta(tree);
    treeEl.addEventListener('click', handleTreeClick);
  } catch (e) {
    document.getElementById('tree').innerHTML = '<div class="error-state">Error loading tree.</div>';
    document.getElementById('tree-meta').innerHTML = '<span class="pill">Tree unavailable</span>';
  }
}

init();
</script>
</body>
</html>
