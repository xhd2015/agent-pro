name: Test

on:
  push:
  pull_request:

env:
  GOFLAGS: -buildvcs=false

# Every labeled and unlabeled leaf runs on PR. Split is only e2e vs !e2e
# (doctest --label flags are OR'd, so each job uses one expression).

jobs:
  go-test:
    runs-on: ubuntu-latest
    container:
      # Match go.work / go.mod (GOTOOLCHAIN=local in official images rejects lower runtimes).
      image: golang:1.25.10
    steps:
      - uses: actions/checkout@v4
      - name: Expose go on default PATH
        run: ln -sf "$(go env GOROOT)/bin/go" /usr/bin/go
      - name: Go test cmd
        run: go -C cmd test ./...
      - name: Go test
        run: go test ./...

  doctest:
    name: doctest ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Must exceed matrix timeout (repo-l2=60m) plus checkout/install overhead.
    # At 40m GHA cancelled mid-suite; at 45m doctest timed out after 337/372 pass.
    timeout-minutes: 70
    container:
      image: golang:1.25.10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-run-l2
            label: "!e2e"
            paths: ./cmd/agent-run/tests/...
          # agent-run e2e: auto-shard top-level dirs under cmd/agent-run/tests
          # (script/ci/doctest-shard-paths.sh) so new packages are never skipped.
          # Shard index is 1-based (1..N).
          - name: agent-run-e2e (1/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 1
            shards: 10
          - name: agent-run-e2e (2/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 2
            shards: 10
          - name: agent-run-e2e (3/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 3
            shards: 10
          - name: agent-run-e2e (4/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 4
            shards: 10
          - name: agent-run-e2e (5/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 5
            shards: 10
          - name: agent-run-e2e (6/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 6
            shards: 10
          - name: agent-run-e2e (7/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 7
            shards: 10
          - name: agent-run-e2e (8/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 8
            shards: 10
          - name: agent-run-e2e (9/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 9
            shards: 10
          - name: agent-run-e2e (10/10)
            label: e2e
            shard_root: cmd/agent-run/tests
            shard: 10
            shards: 10
          - name: pkgs-l2
            label: "!e2e"
            paths: ./pkgs/...
          - name: repo-l2
            label: "!e2e"
            paths: ./tests/...
            # Large ./tests/... suite: 337 leaves passed in 45m then go test -timeout fired.
            timeout: 60m
          - name: repo-e2e
            label: e2e
            paths: ./tests/...
          - name: rest-l2
            label: "!e2e"
            paths: ./cmd/agent-pro/... ./cmd/agent-hub/... ./cmd/fake-codex/... ./cmd/fake-opencode/... ./cmd/migrate-sessions/... ./script/...
          - name: rest-e2e
            label: e2e
            paths: ./cmd/agent-pro/... ./cmd/agent-hub/... ./cmd/fake-codex/... ./cmd/fake-opencode/... ./cmd/migrate-sessions/... ./script/...
          - name: agent-event
            label: "!e2e"
            paths: ./agent/event/...
          - name: agent-grok
            label: "!e2e"
            paths: ./agent/grok/...
          - name: agent-llm
            label: e2e
            paths: ./agent/llm/...
          - name: agent-lib
            label: "!e2e"
            paths: ./agent/subagent/... ./agent/cli/... ./agent/commit_msg/... ./agent/git_runner/... ./agent/usage/... ./agent/codex/...
          - name: agents-l2
            label: "!e2e"
            paths: ./agents/...
          - name: agents-e2e
            label: e2e
            paths: ./agents/...
    steps:
      - uses: actions/checkout@v4
      - name: Expose go on default PATH
        run: ln -sf "$(go env GOROOT)/bin/go" /usr/bin/go
      - name: Install doctest
        run: |
          if ! command -v doctest >/dev/null 2>&1; then
            go install github.com/xhd2015/doctest/cmd/doctest@latest
          fi
      - name: Doctest ${{ matrix.name }}
        run: |
          TIMEOUT="${{ matrix.timeout }}"
          TIMEOUT="${TIMEOUT:-25m}"
          LABEL='${{ matrix.label }}'
          if [ -n "${{ matrix.shard_root }}" ]; then
            PATHS="$(bash script/ci/doctest-shard-paths.sh \
              --root "${{ matrix.shard_root }}" \
              --shard "${{ matrix.shard }}" \
              --shards "${{ matrix.shards }}")"
            if [ -z "$PATHS" ]; then
              echo "shard ${{ matrix.shard }}/${{ matrix.shards }} has no dirs; skipping"
              exit 0
            fi
            echo "shard paths: $PATHS"
            # shellcheck disable=SC2086
            doctest test --no-color -timeout "$TIMEOUT" --label "$LABEL" $PATHS
          else
            # shellcheck disable=SC2086
            doctest test --no-color -timeout "$TIMEOUT" --label "$LABEL" ${{ matrix.paths }}
          fi
