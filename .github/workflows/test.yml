name: Test

on:
  push:
  pull_request:

env:
  GOFLAGS: -buildvcs=false

# Every labeled and unlabeled leaf runs on PR. Split is only e2e vs !e2e
# (doctest --label flags are OR'd, so each job uses one expression).

jobs:
  go-test:
    runs-on: ubuntu-latest
    container:
      # Match go.work / go.mod (GOTOOLCHAIN=local in official images rejects lower runtimes).
      image: golang:1.25.10
    steps:
      - uses: actions/checkout@v4
      - name: Expose go on default PATH
        run: ln -sf "$(go env GOROOT)/bin/go" /usr/bin/go
      - name: Go test cmd
        run: go -C cmd test ./...
      - name: Go test
        run: go test ./...

  doctest:
    name: doctest ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: golang:1.25.10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-run-l2
            label: "!e2e"
            paths: ./cmd/agent-run/tests/...
          - name: agent-run-e2e
            label: e2e
            paths: ./cmd/agent-run/tests/...
          - name: pkgs-l2
            label: "!e2e"
            paths: ./pkgs/...
          - name: repo-l2
            label: "!e2e"
            paths: ./tests/...
            # Large ./tests/... suite: 372 leaves passed but hit 25m package timeout.
            timeout: 35m
          - name: repo-e2e
            label: e2e
            paths: ./tests/...
          - name: rest-l2
            label: "!e2e"
            paths: ./cmd/agent-pro/... ./cmd/agent-hub/... ./cmd/fake-codex/... ./cmd/fake-opencode/... ./cmd/migrate-sessions/... ./script/...
          - name: rest-e2e
            label: e2e
            paths: ./cmd/agent-pro/... ./cmd/agent-hub/... ./cmd/fake-codex/... ./cmd/fake-opencode/... ./cmd/migrate-sessions/... ./script/...
          - name: agent-event
            label: "!e2e"
            paths: ./agent/event/...
          - name: agent-grok
            label: "!e2e"
            paths: ./agent/grok/...
          - name: agent-llm
            label: e2e
            paths: ./agent/llm/...
          - name: agent-lib
            label: "!e2e"
            paths: ./agent/subagent/... ./agent/cli/... ./agent/commit_msg/... ./agent/git_runner/... ./agent/usage/... ./agent/codex/...
          - name: agents-l2
            label: "!e2e"
            paths: ./agents/...
          - name: agents-e2e
            label: e2e
            paths: ./agents/...
    steps:
      - uses: actions/checkout@v4
      - name: Expose go on default PATH
        run: ln -sf "$(go env GOROOT)/bin/go" /usr/bin/go
      - name: Install doctest
        run: |
          if ! command -v doctest >/dev/null 2>&1; then
            go install github.com/xhd2015/doctest/cmd/doctest@latest
          fi
      - name: Doctest ${{ matrix.name }}
        run: |
          TIMEOUT="${{ matrix.timeout }}"
          TIMEOUT="${TIMEOUT:-25m}"
          doctest test --no-color -timeout "$TIMEOUT" --label "${{ matrix.label }}" ${{ matrix.paths }}
