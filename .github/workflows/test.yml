name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Match go.work / go.mod (GOTOOLCHAIN=local in official images rejects lower runtimes).
      image: golang:1.25.10
    env:
      # Nested go build in tests fails under Actions with:
      #   error obtaining VCS status: exit status 128
      # GOFLAGS is inherited by those child builds.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v4
      - name: Go test cmd
        run: go -C cmd test -v ./...
      - name: Go test
        run: go test -v ./...

      - name: Install doctest
        run: |
          if ! command -v doctest >/dev/null 2>&1; then
            go install github.com/xhd2015/doctest/cmd/doctest@latest
          fi
      - name: Doctest
        run: doctest test -v --label-all ./...
