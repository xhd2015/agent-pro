name: Test

on:
  push:
  pull_request:

env:
  GOFLAGS: -buildvcs=false

# Every labeled and unlabeled leaf runs on PR. Split is only e2e vs !e2e
# (doctest --label flags are OR'd, so each job uses one expression).

jobs:
  go-test:
    runs-on: ubuntu-latest
    container:
      # Match go.work / go.mod (GOTOOLCHAIN=local in official images rejects lower runtimes).
      image: golang:1.25.10
    steps:
      - uses: actions/checkout@v4
      - name: Expose go on default PATH
        run: ln -sf "$(go env GOROOT)/bin/go" /usr/bin/go
      - name: Go test cmd
        run: go -C cmd test ./...
      - name: Go test
        run: go test ./...

  doctest:
    name: doctest ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Must exceed matrix timeout (repo-l2=60m) plus checkout/install overhead.
    # At 40m GHA cancelled mid-suite; at 45m doctest timed out after 337/372 pass.
    timeout-minutes: 70
    container:
      image: golang:1.25.10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-run-l2
            label: "!e2e"
            paths: ./cmd/agent-run/tests/...
          # Split agent-run e2e (~400+ leaves) into 3 parallel shards to cut wall time.
          - name: agent-run-e2e-a
            label: e2e
            paths: >-
              ./cmd/agent-run/tests/run/...
              ./cmd/agent-run/tests/run-color/...
              ./cmd/agent-run/tests/run-exit-on-idle/...
              ./cmd/agent-run/tests/run-exit-on-idle-codex-tty/...
              ./cmd/agent-run/tests/run-exit-on-idle-grok-tty/...
              ./cmd/agent-run/tests/auto-send-or-resume/...
              ./cmd/agent-run/tests/send-queue/...
              ./cmd/agent-run/tests/session-env/...
          - name: agent-run-e2e-b
            label: e2e
            paths: >-
              ./cmd/agent-run/tests/grok-tty/...
              ./cmd/agent-run/tests/grok-tty-chat-tail/...
              ./cmd/agent-run/tests/grok-discovery-race/...
              ./cmd/agent-run/tests/codex-tty/...
              ./cmd/agent-run/tests/codex-open-bind-resume/...
              ./cmd/agent-run/tests/codex-run-mcp-boot/...
              ./cmd/agent-run/tests/codex-concurrent-open-bind/...
              ./cmd/agent-run/tests/tty/...
              ./cmd/agent-run/tests/ttyrunner/...
              ./cmd/agent-run/tests/commandcode-tty/...
              ./cmd/agent-run/tests/pty/...
              ./cmd/agent-run/tests/open-resume-e2e/...
              ./cmd/agent-run/tests/open-attach-fidelity/...
              ./cmd/agent-run/tests/status/...
              ./cmd/agent-run/tests/status-resume/...
              ./cmd/agent-run/tests/terminal-poll/...
              ./cmd/agent-run/tests/sessions/...
              ./cmd/agent-run/tests/home/...
              ./cmd/agent-run/tests/kill/...
              ./cmd/agent-run/tests/help/...
              ./cmd/agent-run/tests/takeover/...
              ./cmd/agent-run/tests/cli-edge/...
              ./cmd/agent-run/tests/event-bus/...
              ./cmd/agent-run/tests/event-bus-on-tty/...
              ./cmd/agent-run/tests/enhance-chat/...
          - name: agent-run-e2e-c
            label: e2e
            paths: >-
              ./cmd/agent-run/tests/web/...
              ./cmd/agent-run/tests/web-layout/...
              ./cmd/agent-run/tests/web-cli-subset/...
              ./cmd/agent-run/tests/web-sessions-list/...
              ./cmd/agent-run/tests/web-spa-structured-app/...
              ./cmd/agent-run/tests/web-workspace-path/...
              ./cmd/agent-run/tests/web-workspace-selector/...
              ./cmd/agent-run/tests/web-e2e-grok-harness/...
          - name: pkgs-l2
            label: "!e2e"
            paths: ./pkgs/...
          - name: repo-l2
            label: "!e2e"
            paths: ./tests/...
            # Large ./tests/... suite: 337 leaves passed in 45m then go test -timeout fired.
            timeout: 60m
          - name: repo-e2e
            label: e2e
            paths: ./tests/...
          - name: rest-l2
            label: "!e2e"
            paths: ./cmd/agent-pro/... ./cmd/agent-hub/... ./cmd/fake-codex/... ./cmd/fake-opencode/... ./cmd/migrate-sessions/... ./script/...
          - name: rest-e2e
            label: e2e
            paths: ./cmd/agent-pro/... ./cmd/agent-hub/... ./cmd/fake-codex/... ./cmd/fake-opencode/... ./cmd/migrate-sessions/... ./script/...
          - name: agent-event
            label: "!e2e"
            paths: ./agent/event/...
          - name: agent-grok
            label: "!e2e"
            paths: ./agent/grok/...
          - name: agent-llm
            label: e2e
            paths: ./agent/llm/...
          - name: agent-lib
            label: "!e2e"
            paths: ./agent/subagent/... ./agent/cli/... ./agent/commit_msg/... ./agent/git_runner/... ./agent/usage/... ./agent/codex/...
          - name: agents-l2
            label: "!e2e"
            paths: ./agents/...
          - name: agents-e2e
            label: e2e
            paths: ./agents/...
    steps:
      - uses: actions/checkout@v4
      - name: Expose go on default PATH
        run: ln -sf "$(go env GOROOT)/bin/go" /usr/bin/go
      - name: Install doctest
        run: |
          if ! command -v doctest >/dev/null 2>&1; then
            go install github.com/xhd2015/doctest/cmd/doctest@latest
          fi
      - name: Doctest ${{ matrix.name }}
        run: |
          TIMEOUT="${{ matrix.timeout }}"
          TIMEOUT="${TIMEOUT:-25m}"
          doctest test --no-color -timeout "$TIMEOUT" --label "${{ matrix.label }}" ${{ matrix.paths }}
